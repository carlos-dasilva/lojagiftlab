name: Testes e deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: giftlab-production
  cancel-in-progress: false

jobs:
  tests:
    name: Testes e build
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar o PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none

      - name: Preparar o Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Validar o Composer
        run: composer validate --no-check-publish

      - name: Instalar dependências PHP
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Preparar o ambiente de testes
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Verificar formatação PHP
        run: vendor/bin/pint --test

      - name: Instalar dependências do frontend
        run: npm ci

      - name: Compilar o frontend
        run: npm run build

      - name: Executar os testes automatizados
        run: php artisan test

  deploy:
    name: Publicar na Hostinger
    needs: tests
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://lojagiftlab.com

    steps:
      - name: Baixar o código aprovado
        uses: actions/checkout@v4

      - name: Preparar o PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Preparar o Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependências de produção
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Compilar arquivos de produção
        run: npm ci && npm run build

      - name: Configurar conexão segura com a Hostinger
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
        run: |
          test -n "$SSH_PRIVATE_KEY" && test -n "$SSH_HOST" && test -n "$SSH_PORT"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/hostinger
          chmod 600 ~/.ssh/hostinger
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Conferir a configuração do servidor
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          DEPLOY_PATH: ${{ secrets.HOSTINGER_DEPLOY_PATH }}
        run: |
          [[ "$DEPLOY_PATH" == /home/* ]] || { echo "HOSTINGER_DEPLOY_PATH precisa ser um caminho dentro de /home."; exit 1; }
          ssh -i ~/.ssh/hostinger -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "test -d '$DEPLOY_PATH' && test -f '$DEPLOY_PATH/.env'"

      - name: Enviar a nova versão
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          DEPLOY_PATH: ${{ secrets.HOSTINGER_DEPLOY_PATH }}
        run: |
          rsync -az --delete \
            --exclude='.env' \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='docs/' \
            --exclude='node_modules/' \
            --exclude='tests/' \
            --exclude='public/storage' \
            --exclude='storage/app/public/' \
            --exclude='storage/framework/cache/' \
            --exclude='storage/framework/sessions/' \
            --exclude='storage/framework/views/' \
            --exclude='storage/logs/' \
            -e "ssh -i ~/.ssh/hostinger -p $SSH_PORT" \
            ./ "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/"

      - name: Finalizar a publicação
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          DEPLOY_PATH: ${{ secrets.HOSTINGER_DEPLOY_PATH }}
        run: |
          ssh -i ~/.ssh/hostinger -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "cd '$DEPLOY_PATH' && mkdir -p storage/app/public storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs bootstrap/cache && chmod -R ug+rwX storage bootstrap/cache && php artisan migrate --force && (php artisan storage:link || true) && php artisan optimize"

      - name: Confirmar que o site está respondendo
        run: curl --fail --silent --show-error --retry 5 --retry-delay 5 https://lojagiftlab.com > /dev/null
